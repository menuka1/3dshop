appId=YOUR_APP_ID
accessKey=YOUR_ACCESS_KEY
privateKeyFile=keys/private.pem
adminPassword=choose-a-long-password
port=8080
bind=0.0.0.0
endpoint=https://openapi.jlc.com
shipCountry=Sri Lanka
shipCity=Colombo
cookieSecure=false
trustProxy=false
corsOrigin=
# public address of the website (used for canonical URLs, sitemap.xml and social previews)
siteUrl=https://3dshop.lk
# redirect http -> https (only works with trustProxy=true and a proxy that sends X-Forwarded-Proto)
forceHttps=false
# optional: only these IP addresses may open /admin (comma separated). Leave empty to allow everyone.
adminAllowIps=
